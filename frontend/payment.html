<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-20">


    <!-- NAVBAR -->

    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">

        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between relative">

            <!-- MOBILE MENU BUTTON -->

            <button
                id="mobileMenuButton"
                type="button"
                class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-cyan-400 hover:bg-slate-800 transition text-2xl"
                aria-label="Open navigation menu"
                aria-expanded="false">

                ☰

            </button>


            <!-- LOGO -->

            <div class="flex items-center justify-center">

                <a href="index.html">

                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB logo"
                        class="w-32 h-auto">

                </a>

            </div>


            <!-- DESKTOP NAVIGATION -->

            <div class="hidden md:flex items-center justify-center gap-6">

                <a
                    href="index.html"
                    class="hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="hover:text-cyan-400 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- DESKTOP AUTHENTICATION -->

            <div
                id="authLinks"
                class="hidden md:flex items-center justify-end gap-5 pr-4">

            </div>

        </nav>


        <!-- MOBILE MENU -->

        <div
            id="mobileMenu"
            class="hidden md:hidden bg-slate-950 border-t border-slate-800">

            <div class="flex flex-col px-5 py-4 gap-1">

                <!-- MAIN NAVIGATION -->

                <a
                    href="index.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- MOBILE AUTHENTICATION -->

            <div
                id="mobileAuthLinks"
                class="flex flex-col px-5 pb-5 gap-1">

            </div>

        </div>

    </header>


    <!-- MAIN -->

    <main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 md:py-12">


        <!-- PAGE HEADER -->

        <div class="text-center mb-8 md:mb-10">

            <p
                class="text-cyan-400 uppercase tracking-widest text-sm font-semibold mb-2">

                PAYMENT

            </p>


            <h1
                class="text-3xl sm:text-4xl md:text-5xl font-bold">

                Complete Payment

            </h1>


            <p
                class="text-slate-400 mt-3">

                Review your order and complete the payment.

            </p>

        </div>


        <!-- MESSAGE -->

        <div
            id="paymentMessage"
            class="hidden mb-6 rounded-lg p-4">

        </div>


        <!-- PAYMENT CARD -->

        <section
            class="bg-slate-900
                   border border-slate-800
                   rounded-2xl
                   p-5 sm:p-8">

            <div class="space-y-6">


                <!-- ORDER -->

                <div
                    class="flex flex-col sm:flex-row
                           sm:justify-between
                           sm:items-center
                           gap-2">

                    <span class="text-slate-400">

                        Order

                    </span>

                    <span
                        id="orderId"
                        class="font-semibold break-all">

                        —

                    </span>

                </div>


                <!-- DIVIDER -->

                <div class="border-t border-slate-800">
                </div>


                <!-- AMOUNT -->

                <div
                    class="flex flex-col sm:flex-row
                           sm:justify-between
                           sm:items-center
                           gap-2">

                    <span class="text-slate-400">

                        Amount

                    </span>

                    <span
                        id="paymentAmount"
                        class="text-2xl font-bold text-cyan-400">

                        ₦0

                    </span>

                </div>


                <!-- PAYMENT STATUS -->

                <div
                    class="flex flex-col sm:flex-row
                           sm:justify-between
                           sm:items-center
                           gap-2">

                    <span class="text-slate-400">

                        Payment status

                    </span>

                    <span
                        id="paymentStatus"
                        class="self-start sm:self-auto
                               px-3 py-1
                               rounded-full
                               text-sm
                               bg-yellow-500/10
                               text-yellow-400">

                        Pending

                    </span>

                </div>


                <!-- PAY BUTTON -->

                <button
                    id="payButton"
                    type="button"
                    class="w-full
                           py-3
                           rounded-lg
                           bg-cyan-500
                           text-slate-950
                           font-semibold
                           hover:bg-cyan-400
                           transition">

                    Pay Now

                </button>


                <!-- BACK TO ORDERS -->

                <a
                    href="orders.html"
                    class="block text-center
                           text-slate-400
                           hover:text-cyan-400
                           transition">

                    Back to Orders

                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer
        class="border-t border-slate-800
               mt-12 md:mt-16">

        <div
            class="max-w-7xl mx-auto
                   px-4 sm:px-6
                   py-8">

            <p class="text-center text-slate-500">

                © 2026 PC HUB. All rights reserved.

            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT FILES -->

    <script src="js/api.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/userAuthGuard.js"></script>
    <script src="js/navbar.js"></script>

</body>

</html>
