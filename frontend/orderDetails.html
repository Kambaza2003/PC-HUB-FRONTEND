<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-20">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-20 flex items-center justify-between">

                <a href="index.html" class="flex items-center">
                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB"
                        class="h-10 w-auto"
                    >
                </a>

                <div class="hidden md:flex items-center gap-8">
                    <a href="index.html" class="text-slate-300 hover:text-cyan-400 transition">
                        Home
                    </a>

                    <a href="products.html" class="text-slate-300 hover:text-cyan-400 transition">
                        Products
                    </a>

                    <a href="about.html" class="text-slate-300 hover:text-cyan-400 transition">
                        About
                    </a>

                    <a href="contact.html" class="text-slate-300 hover:text-cyan-400 transition">
                        Contact
                    </a>

                    <div id="authLinks" class="flex items-center gap-4"></div>
                </div>

                <!-- Mobile Menu Button -->
                <button
                    id="menuBtn"
                    class="md:hidden text-slate-300 hover:text-white"
                    aria-label="Open menu"
                >
                    ☰
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden md:hidden pb-5">
                <div class="flex flex-col gap-4">

                    <a href="index.html" class="text-slate-300 hover:text-cyan-400">
                        Home
                    </a>

                    <a href="products.html" class="text-slate-300 hover:text-cyan-400">
                        Products
                    </a>

                    <a href="about.html" class="text-slate-300 hover:text-cyan-400">
                        About
                    </a>

                    <a href="contact.html" class="text-slate-300 hover:text-cyan-400">
                        Contact
                    </a>

                    <div id="mobileAuthLinks"></div>
                </div>
            </div>
        </div>
    </nav>


    <!-- Main -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- Back -->
        <a
            href="orders.html"
            class="inline-flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition mb-8"
        >
            ← Back to My Orders
        </a>

        <!-- Page Heading -->
        <div class="mb-8">
            <p class="text-sm text-cyan-400 font-semibold tracking-wider uppercase">
                Order Details
            </p>

            <h1 class="text-3xl sm:text-4xl font-bold mt-2">
                Order Information
            </h1>

            <p class="text-slate-400 mt-2">
                View the complete details of your order.
            </p>
        </div>

        <!-- Message -->
        <div
            id="orderMessage"
            class="hidden mb-6 rounded-lg p-4"
        ></div>

        <!-- Loading -->
        <div
            id="loadingMessage"
            class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400"
        >
            Loading order details...
        </div>

        <!-- Order Details -->
        <section
            id="orderDetailsContainer"
            class="hidden"
        ></section>

    </main>


    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <p class="text-center text-slate-500 text-sm">
                © 2026 PC HUB. All rights reserved.
            </p>
        </div>
    </footer>


    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/orderDetails.js"></script>
    <script src="js/userAuthGuard.js"></script>
    <script src="js/navbar.js"></script>

</body>
</html>
