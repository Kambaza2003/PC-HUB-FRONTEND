<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment | PC HUB</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">
        <nav class="max-w-7xl mx-auto px-6 py-4 grid grid-cols-3 items-center">

            <!-- Logo -->
            <div class="justify-self-start">
                <a href="index.html" class="justify-self-start">
                    <img src="img/PC_HUB_logo.png" alt="PC HUB logo" class="w-32 h-auto">
                </a>
            </div>

            <!-- Main Navigation -->
            <div class="flex items-center justify-center gap-6">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="products.html" class="hover:text-cyan-400 transition">Products</a>
                <a href="about.html" class="hover:text-cyan-400 transition">About</a>
                <a href="contact.html" class="hover:text-cyan-400 transition">Contact</a>
            </div>

            <!-- Authentication Navigation -->
            <div id="authLinks" class="flex items-center justify-end gap-5 pr-4">
            </div>

        </nav>
    </header>


    <!-- MAIN -->
    <main class="max-w-2xl mx-auto px-6 py-12">

        <div class="text-center mb-10">

            <p class="text-cyan-400 uppercase tracking-widest
                      text-sm font-semibold mb-2">
                PAYMENT
            </p>

            <h1 class="text-4xl font-bold">
                Complete Payment
            </h1>

            <p class="text-slate-400 mt-3">
                Review your order and complete the payment.
            </p>

        </div>


        <!-- MESSAGE -->
        <div id="paymentMessage"
             class="hidden mb-6 rounded-lg p-4">
        </div>


        <!-- PAYMENT CARD -->
        <section
            class="bg-slate-900 border border-slate-800
                   rounded-2xl p-8">

            <div class="space-y-6">

                <div class="flex justify-between
                            items-center">

                    <span class="text-slate-400">
                        Order
                    </span>

                    <span id="orderId"
                          class="font-semibold">
                        —
                    </span>

                </div>


                <div class="border-t border-slate-800">
                </div>


                <div class="flex justify-between
                            items-center">

                    <span class="text-slate-400">
                        Amount
                    </span>

                    <span id="paymentAmount"
                          class="text-2xl font-bold
                                 text-cyan-400">
                        ₦0
                    </span>

                </div>


                <div class="flex justify-between
                            items-center">

                    <span class="text-slate-400">
                        Payment status
                    </span>

                    <span id="paymentStatus"
                          class="px-3 py-1 rounded-full
                                 text-sm
                                 bg-yellow-500/10
                                 text-yellow-400">
                        Pending
                    </span>

                </div>


                <button
                    id="payButton"
                    class="w-full py-3 rounded-lg
                           bg-cyan-500
                           text-slate-950
                           font-semibold
                           hover:bg-cyan-400
                           transition">

                    Pay Now

                </button>


                <a href="orders.html"
                   class="block text-center
                          text-slate-400
                          hover:text-cyan-400
                          transition">

                    Back to Orders

                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-800 mt-16">

        <div class="max-w-7xl mx-auto px-6 py-8">

            <p class="text-center text-slate-500">
                © 2026 PC HUB. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/api.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/userAuthGuard.js"></script>
    <script src="js/navbar.js"></script>

</body>

</html>
