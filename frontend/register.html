<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | PC HUB</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950 border-b border-slate-800">
        <nav class="max-w-7xl mx-auto px-6 py-4">

            <div class="flex items-center justify-between">

                <a href="index.html"
                   class="text-2xl font-bold text-cyan-400">
                    PC HUB
                </a>

                <a href="login.html"
                   class="text-slate-300 hover:text-cyan-400 transition">
                    Already have an account? Login
                </a>

            </div>

        </nav>
    </header>


    <!-- REGISTER -->
    <main class="min-h-[calc(100vh-73px)] flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-md">

            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold mb-3">
                    Create Your Account
                </h1>

                <p class="text-slate-400">
                    Join PC HUB and start shopping for your setup.
                </p>

            </div>


            <form id="registerForm"
                  class="bg-slate-900 border border-slate-800
                         rounded-2xl p-8 space-y-5">

                <!-- NAME -->
                <div>

                    <label for="name"
                           class="block text-sm font-medium
                                  text-slate-300 mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        class="w-full px-4 py-3 rounded-lg
                               bg-slate-950 border border-slate-700
                               text-white outline-none
                               focus:border-cyan-400"
                        placeholder="Enter your full name"
                    >

                </div>


                <!-- EMAIL -->
                <div>

                    <label for="email"
                           class="block text-sm font-medium
                                  text-slate-300 mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 rounded-lg
                               bg-slate-950 border border-slate-700
                               text-white outline-none
                               focus:border-cyan-400"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- PASSWORD -->
                <div>

                    <label for="password"
                           class="block text-sm font-medium
                                  text-slate-300 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 rounded-lg
                               bg-slate-950 border border-slate-700
                               text-white outline-none
                               focus:border-cyan-400"
                        placeholder="Create a password"
                    >

                </div>


                <!-- MESSAGE -->
                <p id="registerMessage"
                   class="hidden text-sm">
                </p>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="w-full py-3 rounded-lg
                           bg-cyan-500 text-slate-950
                           font-semibold
                           hover:bg-cyan-400 transition">
                    Create Account
                </button>


                <p class="text-center text-sm text-slate-500">
                    Already registered?

                    <a href="login.html"
                       class="text-cyan-400 hover:underline">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
