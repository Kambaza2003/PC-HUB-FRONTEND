<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-20">

   <!-- NAVBAR -->

    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">

        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between relative">

            <!-- MOBILE MENU BUTTON -->

            <button
                id="mobileMenuButton"
                type="button"
                class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-cyan-400 hover:bg-slate-800 transition text-2xl"
                aria-label="Open navigation menu"
                aria-expanded="false">

                ☰

            </button>


            <!-- LOGO -->

            <div class="flex items-center justify-center">

                <a href="index.html">

                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB logo"
                        class="w-32 h-auto">

                </a>

            </div>


            <!-- DESKTOP NAVIGATION -->

            <div class="hidden md:flex items-center justify-center gap-6">

                <a
                    href="index.html"
                    class="hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="hover:text-cyan-400 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- DESKTOP AUTHENTICATION -->

            <div
                id="authLinks"
                class="hidden md:flex items-center justify-end gap-5 pr-4">

            </div>

        </nav>


        <!-- MOBILE MENU -->

        <div
            id="mobileMenu"
            class="hidden md:hidden bg-slate-950 border-t border-slate-800">

            <div class="flex flex-col px-5 py-4 gap-1">

                <!-- MAIN NAVIGATION -->

                <a
                    href="index.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- MOBILE AUTHENTICATION -->

            <div
                id="mobileAuthLinks"
                class="flex flex-col px-5 pb-5 gap-1">

            </div>

        </div>

    </header>

    <!-- Main -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- Back -->
        <a
            href="orders.html"
            class="inline-flex items-center gap-2 text-slate-400 hover:text-cyan-400 transition mb-8"
        >
            ← Back to My Orders
        </a>

        <!-- Page Heading -->
        <div class="mb-8">
            <p class="text-sm text-cyan-400 font-semibold tracking-wider uppercase">
                Order Details
            </p>

            <h1 class="text-3xl sm:text-4xl font-bold mt-2">
                Order Information
            </h1>

            <p class="text-slate-400 mt-2">
                View the complete details of your order.
            </p>
        </div>

        <!-- Message -->
        <div
            id="orderMessage"
            class="hidden mb-6 rounded-lg p-4"
        ></div>

        <!-- Loading -->
        <div
            id="loadingMessage"
            class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400"
        >
            Loading order details...
        </div>

        <!-- Order Details -->
        <section
            id="orderDetailsContainer"
            class="hidden"
        ></section>

    </main>


    <!-- Footer -->
    <footer class="border-t border-slate-800 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <p class="text-center text-slate-500 text-sm">
                © 2026 PC HUB. All rights reserved.
            </p>
        </div>
    </footer>


    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/orderDetails.js"></script>
    <script src="js/userAuthGuard.js"></script>
    <script src="js/navbar.js"></script>

</body>
</html>
