<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-20">

    <!-- NAVBAR -->

    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">

        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between relative">

            <!-- MOBILE MENU BUTTON -->

            <button
                id="mobileMenuButton"
                type="button"
                class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-cyan-400 hover:bg-slate-800 transition text-2xl"
                aria-label="Open navigation menu"
                aria-expanded="false">

                ☰

            </button>


            <!-- LOGO -->

            <div class="flex items-center justify-center">

                <a href="index.html">

                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB logo"
                        class="w-32 h-auto">

                </a>

            </div>


            <!-- DESKTOP NAVIGATION -->

            <div class="hidden md:flex items-center justify-center gap-6">

                <a
                    href="index.html"
                    class="hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="hover:text-cyan-400 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- DESKTOP AUTHENTICATION -->

            <div
                id="authLinks"
                class="hidden md:flex items-center justify-end gap-5 pr-4">

            </div>

        </nav>


        <!-- MOBILE MENU -->

        <div
            id="mobileMenu"
            class="hidden md:hidden bg-slate-950 border-t border-slate-800">

            <div class="flex flex-col px-5 py-4 gap-1">

                <a
                    href="index.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- MOBILE AUTHENTICATION -->

            <div
                id="mobileAuthLinks"
                class="flex flex-col px-5 pb-5 gap-1">

            </div>

        </div>

    </header>


    <!-- MAIN -->

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 md:py-12">

        <!-- PAGE HEADER -->

        <div class="mb-8 md:mb-10">

            <p
                class="text-cyan-400 uppercase tracking-widest text-sm font-semibold mb-2">

                YOUR CART

            </p>


            <h1 class="text-3xl sm:text-4xl font-bold">

                Shopping Cart

            </h1>

        </div>


        <!-- MESSAGE -->

        <div
            id="cartMessage"
            class="hidden mb-8 rounded-lg p-4">

        </div>


        <!-- CART CONTENT -->

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">

            <!-- ITEMS -->

            <section
                id="cartContainer"
                class="lg:col-span-2 space-y-4 min-w-0">

            </section>


            <!-- SUMMARY -->

            <aside
                class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 h-fit w-full">

                <h2 class="text-xl sm:text-2xl font-semibold mb-6">

                    Order Summary

                </h2>


                <div
                    class="flex justify-between items-center text-slate-400 mb-3">

                    <span>
                        Items
                    </span>

                    <span id="cartItemCount">

                        0

                    </span>

                </div>


                <div
                    class="border-t border-slate-800 pt-4 mt-4">

                    <div
                        class="flex justify-between items-center gap-4">

                        <span class="text-lg">

                            Total

                        </span>


                        <span
                            id="cartTotal"
                            class="text-xl sm:text-2xl font-bold text-cyan-400 text-right">

                            ₦0

                        </span>

                    </div>

                </div>


                <button
                    id="checkoutButton"
                    type="button"
                    class="w-full mt-6 py-3 rounded-lg bg-cyan-500 text-slate-950 font-semibold hover:bg-cyan-400 transition">

                    Proceed to Checkout

                </button>

            </aside>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="border-t border-slate-800 mt-12 md:mt-16">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

            <p class="text-center text-slate-500">

                © 2026 PC HUB. All rights reserved.

            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT FILES -->

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/userAuthGuard.js"></script>
    <script src="js/navbar.js"></script>

</body>

</html>
