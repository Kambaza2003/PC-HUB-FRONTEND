<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-12">

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">
        <nav class="max-w-7xl mx-auto px-6 py-4 grid grid-cols-3 items-center">

            <!-- Logo -->
            <div class="justify-self-start">
                <a href="index.html" class="justify-self-start">
                    <img src="img/PC_HUB_logo.png" alt="PC HUB logo" class="w-32 h-auto">
                </a>
            </div>

            <!-- Main Navigation -->
            <div class="flex items-center justify-center gap-6">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="products.html" class="hover:text-cyan-400 transition">Products</a>
                <a href="about.html" class="hover:text-cyan-400 transition">About</a>
                <a href="contact.html" class="hover:text-cyan-400 transition">Contact</a>
            </div>

            <!-- Authentication Navigation -->
            <div id="authLinks" class="flex items-center justify-end gap-5 pr-4">
            </div>

        </nav>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-12">

        <div class="mb-10">

            <p class="text-cyan-400 uppercase tracking-widest
                      text-sm font-semibold mb-2">
                YOUR CART
            </p>

            <h1 class="text-4xl font-bold">
                Shopping Cart
            </h1>

        </div>


        <!-- MESSAGE -->
        <div id="cartMessage"
             class="hidden mb-8 rounded-lg p-4">
        </div>


        <!-- CART CONTENT -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- ITEMS -->
            <section
                id="cartContainer"
                class="lg:col-span-2 space-y-4">

            </section>


            <!-- SUMMARY -->
            <aside
                class="bg-slate-900 border border-slate-800
                       rounded-2xl p-6 h-fit">

                <h2 class="text-2xl font-semibold mb-6">
                    Order Summary
                </h2>


                <div class="flex justify-between
                            text-slate-400 mb-3">

                    <span>Items</span>

                    <span id="cartItemCount">
                        0
                    </span>

                </div>


                <div class="border-t border-slate-800
                            pt-4 mt-4">

                    <div class="flex justify-between
                                items-center">

                        <span class="text-lg">
                            Total
                        </span>

                        <span id="cartTotal"
                              class="text-2xl font-bold
                                     text-cyan-400">
                            ₦0
                        </span>

                    </div>

                </div>


                <button
                    id="checkoutButton"
                    class="w-full mt-6 py-3 rounded-lg
                           bg-cyan-500 text-slate-950
                           font-semibold
                           hover:bg-cyan-400 transition">

                    Proceed to Checkout

                </button>

            </aside>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-800 mt-16">

        <div class="max-w-7xl mx-auto px-6 py-8">

            <p class="text-center text-slate-500">
                © 2026 PC HUB. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/userAuthGuard.js"></script>
    <script src="js/navbar.js"></script>

</body>

</html>
