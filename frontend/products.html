<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-12">

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">

        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between relative">

            <!-- MOBILE MENU BUTTON -->
            <button
                id="mobileMenuButton"
                type="button"
                class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:text-cyan-400 hover:bg-slate-800 transition text-2xl"
                aria-label="Open navigation menu"
                aria-expanded="false">

                ☰

            </button>


            <!-- LOGO -->
            <div class="flex items-center justify-center">

                <a href="index.html">

                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB logo"
                        class="w-32 h-auto">

                </a>

            </div>


            <!-- MAIN NAVIGATION -->
            <div class="hidden md:flex items-center justify-center gap-6">

                <a
                    href="index.html"
                    class="hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="text-cyan-400 hover:text-cyan-200 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- AUTHENTICATION NAVIGATION -->
            <div
                id="authLinks"
                class="hidden md:flex items-center justify-end gap-5 pr-4">

            </div>

        </nav>


        <!-- MOBILE MENU -->
        <div
            id="mobileMenu"
            class="hidden md:hidden bg-slate-950 border-t border-slate-800">

            <!-- MOBILE NAVIGATION -->
            <div class="flex flex-col px-5 py-4 gap-1">

                <a
                    href="index.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Home

                </a>

                <a
                    href="products.html"
                    class="px-4 py-3 rounded-lg text-cyan-400 hover:bg-slate-900 transition">

                    Products

                </a>

                <a
                    href="about.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    About

                </a>

                <a
                    href="contact.html"
                    class="px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-cyan-400 transition">

                    Contact

                </a>

            </div>


            <!-- MOBILE AUTHENTICATION -->
            <div
                id="mobileAuthLinks"
                class="flex flex-col px-5 pb-5 gap-1">

            </div>

        </div>

    </header>


    <!-- PAGE -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-10 md:py-12">


        <!-- PAGE HEADER -->
        <div class="mb-8 md:mb-10">

            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-6">


                <!-- TITLE -->
                <div class="min-w-0">

                    <p class="text-cyan-400 uppercase tracking-widest text-sm font-semibold mb-2">

                        PC HUB STORE

                    </p>

                    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-4">

                        Explore Our Products

                    </h1>

                </div>


                <!-- SEARCH AREA -->
                <div class="relative w-full sm:w-12 h-12 mt-0 sm:mt-2 flex-shrink-0">

                    <!-- SEARCH INPUT -->
                    <div
                        id="searchWrapper"
                        class="absolute right-14 top-0 w-0 overflow-hidden opacity-0 transition-all duration-300 ease-in-out">

                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Search products..."
                            class="w-64 max-w-[calc(100vw-6rem)] h-12 px-4 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">

                    </div>


                    <!-- SEARCH BUTTON -->
                    <button
                        id="searchButton"
                        type="button"
                        aria-label="Search products"
                        class="absolute right-0 top-0 w-12 h-12 flex items-center justify-center rounded-xl bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20 hover:bg-cyan-400 hover:scale-105 transition-all duration-200">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="2"
                            stroke="currentColor"
                            class="w-6 h-6">

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m21 21-4.35-4.35m1.35-5.4a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z">

                            </path>

                        </svg>

                    </button>

                </div>

            </div>


            <!-- DESCRIPTION -->
            <p class="text-slate-400 max-w-2xl">

                Browse our collection of computers, monitors,
                laptops and other technology products.

            </p>

        </div>


        <!-- FILTERS -->
        <section class="mb-8 md:mb-10">

            <div
                class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6">

                <div
                    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">


                    <!-- CATEGORY -->
                    <div>

                        <label
                            for="categoryFilter"
                            class="block text-sm text-slate-400 mb-2">

                            Category

                        </label>

                        <select
                            id="categoryFilter"
                            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-400">

                            <option value="">
                                All Categories
                            </option>

                        </select>

                    </div>


                    <!-- MINIMUM PRICE -->
                    <div>

                        <label
                            for="minPrice"
                            class="block text-sm text-slate-400 mb-2">

                            Minimum Price

                        </label>

                        <input
                            id="minPrice"
                            type="number"
                            min="0"
                            placeholder="₦0"
                            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">

                    </div>


                    <!-- MAXIMUM PRICE -->
                    <div>

                        <label
                            for="maxPrice"
                            class="block text-sm text-slate-400 mb-2">

                            Maximum Price

                        </label>

                        <input
                            id="maxPrice"
                            type="number"
                            min="0"
                            placeholder="₦1,000,000"
                            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">

                    </div>


                    <!-- SORT -->
                    <div>

                        <label
                            for="sortFilter"
                            class="block text-sm text-slate-400 mb-2">

                            Sort By

                        </label>

                        <select
                            id="sortFilter"
                            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-400">

                            <option value="">
                                Default
                            </option>

                            <option value="price_asc">
                                Price: Low → High
                            </option>

                            <option value="price_desc">
                                Price: High → Low
                            </option>

                            <option value="name_asc">
                                Name: A → Z
                            </option>

                            <option value="name_desc">
                                Name: Z → A
                            </option>

                        </select>

                    </div>

                </div>


                <!-- FILTER BUTTONS -->
                <div class="flex flex-col sm:flex-row gap-3 mt-6">

                    <button
                        id="applyFiltersButton"
                        type="button"
                        class="w-full sm:w-auto px-6 py-3 rounded-lg bg-slate-700 text-cyan-200 font-semibold hover:text-cyan-400 transition">

                        Apply Filters

                    </button>


                    <button
                        id="clearFiltersButton"
                        type="button"
                        class="w-full sm:w-auto px-6 py-3 rounded-lg border border-slate-700 text-red-500 hover:bg-slate-800 transition">

                        Clear

                    </button>

                </div>

            </div>

        </section>


        <!-- MESSAGE -->
        <div
            id="productsMessage"
            class="hidden mb-8 rounded-lg p-4">

        </div>


        <!-- PRODUCTS -->
        <section
            id="productsContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 md:gap-6">

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-800 mt-12 md:mt-16">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

            <p class="text-center text-slate-500">

                © 2026 PC HUB. All rights reserved.

            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/api.js"></script>
    <script src="js/products.js"></script>
    <script src="js/navbar.js"></script>

</body>

</html>
