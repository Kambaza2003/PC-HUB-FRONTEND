<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white pt-20">

    <!-- NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur border-b border-slate-800">

        <nav class="max-w-7xl mx-auto px-6 py-4 grid grid-cols-3 items-center">

            <!-- LOGO -->
            <div class="justify-self-start">

                <a href="index.html">

                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB logo"
                        class="w-32 h-auto"
                    >

                </a>

            </div>


            <!-- NAVIGATION -->
            <div class="flex items-center justify-center gap-6">

                <a
                    href="index.html"
                    class="hover:text-cyan-400 transition">
                    Home
                </a>

                <a
                    href="products.html"
                    class="text-cyan-400 hover:text-cyan-200 transition">
                    Products
                </a>

                <a
                    href="about.html"
                    class="hover:text-cyan-400 transition">
                    About
                </a>

                <a
                    href="contact.html"
                    class="hover:text-cyan-400 transition">
                    Contact
                </a>

            </div>


            <!-- AUTH -->
            <div
                id="authLinks"
                class="flex items-center justify-end gap-5 pr-4">
            </div>

        </nav>

    </header>


    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-6 py-12">

        <!-- BACK -->
        <div class="mb-8">

            <a
                href="products.html"
                class="inline-flex items-center gap-2
                       text-slate-400
                       hover:text-cyan-400
                       transition">

                <span>←</span>

                Back to Products

            </a>

        </div>


        <!-- MESSAGE -->
        <div
            id="productMessage"
            class="hidden mb-8 rounded-lg p-4">
        </div>


        <!-- LOADING -->
        <div
            id="loadingMessage"
            class="text-center py-20">

            <p class="text-slate-400 text-lg">
                Loading product...
            </p>

        </div>


        <!-- PRODUCT -->
        <section
            id="productContainer"
            class="hidden">

            <div
                class="grid grid-cols-1
                       lg:grid-cols-2
                       gap-12
                       items-start">


            <!-- PRODUCT IMAGE -->
                <div>

                    <!-- MAIN IMAGE -->
                    <div
                        class="bg-slate-900
                            border border-slate-800
                            rounded-2xl
                            overflow-hidden
                            h-[450px]
                            flex items-center justify-center">

                        <img
                            id="productImage"
                            src=""
                            alt=""
                            class="w-full h-full object-contain p-8"
                        >

                    </div>


                    <!-- PRODUCT IMAGE VIEWS -->
                    <div
                        id="productImageGallery"
                        class="mt-4
                            flex
                            gap-4
                            flex-wrap">

                    </div>

                </div>

                <!-- PRODUCT INFORMATION -->
                <div>

                    <!-- CATEGORY -->
                    <p
                        id="productCategory"
                        class="text-cyan-400
                               uppercase
                               tracking-widest
                               text-sm
                               font-semibold
                               mb-3">

                        PRODUCT

                    </p>


                    <!-- NAME -->
                    <h1
                        id="productName"
                        class="text-4xl
                               md:text-5xl
                               font-bold
                               mb-5">

                    </h1>


                    <!-- PRICE -->
                    <p
                        id="productPrice"
                        class="text-3xl
                               font-bold
                               text-cyan-400
                               mb-6">

                    </p>


                    <!-- STOCK -->
                    <div class="mb-8">

                        <span
                            id="productStock"
                            class="inline-flex
                                   px-4 py-2
                                   rounded-full
                                   text-sm
                                   font-semibold">

                        </span>

                    </div>


                    <!-- DESCRIPTION -->
                    <div class="mb-8">

                        <h2
                            class="text-xl
                                   font-semibold
                                   mb-3">

                            Description

                        </h2>

                        <p
                            id="productDescription"
                            class="text-slate-400
                                   leading-7">

                        </p>

                    </div>


                    <!-- SPECIFICATIONS -->
                    <div class="mb-8">

                        <h2
                            class="text-xl
                                   font-semibold
                                   mb-4">

                            Product Information

                        </h2>

                        <div
                            class="bg-slate-900
                                   border border-slate-800
                                   rounded-xl
                                   divide-y
                                   divide-slate-800">

                            <div
                                class="flex justify-between
                                       gap-6
                                       px-5 py-4">

                                <span class="text-slate-400">
                                    Product ID
                                </span>

                                <span
                                    id="productId"
                                    class="font-medium">

                                </span>

                            </div>


                            <div
                                class="flex justify-between
                                       gap-6
                                       px-5 py-4">

                                <span class="text-slate-400">
                                    Category
                                </span>

                                <span
                                    id="productCategoryInfo"
                                    class="font-medium">

                                </span>

                            </div>


                            <div
                                class="flex justify-between
                                       gap-6
                                       px-5 py-4">

                                <span class="text-slate-400">
                                    Availability
                                </span>

                                <span
                                    id="productAvailability"
                                    class="font-medium">

                                </span>

                            </div>

                        </div>

                    </div>


                    <!-- QUANTITY -->
                    <div class="mb-6">

                        <label
                            for="quantity"
                            class="block
                                   text-slate-400
                                   text-sm
                                   mb-2">

                            Quantity

                        </label>


                        <div class="flex items-center gap-3">

                            <button
                                id="decreaseQuantity"
                                type="button"
                                class="w-11 h-11
                                       rounded-lg
                                       bg-slate-800
                                       border border-slate-700
                                       hover:border-cyan-400
                                       transition">

                                −

                            </button>


                            <input
                                id="quantity"
                                type="number"
                                value="1"
                                min="1"
                                class="w-20 h-11
                                       text-center
                                       rounded-lg
                                       bg-slate-800
                                       border border-slate-700
                                       focus:outline-none
                                       focus:border-cyan-400"
                            >


                            <button
                                id="increaseQuantity"
                                type="button"
                                class="w-11 h-11
                                       rounded-lg
                                       bg-slate-800
                                       border border-slate-700
                                       hover:border-cyan-400
                                       transition">

                                +

                            </button>

                        </div>

                    </div>


                    <!-- ADD TO CART -->
                    <button
                        id="addToCartButton"
                        type="button"
                        class="w-full
                               py-4
                               rounded-xl
                               bg-cyan-500
                               text-slate-950
                               font-bold
                               text-lg
                               hover:bg-cyan-400
                               transition
                               disabled:opacity-50
                               disabled:cursor-not-allowed">

                        Add to Cart

                    </button>

                </div>

            </div>

        </section>

        <!-- RELATED PRODUCTS -->
        <section
            id="relatedProductsSection"
            class="hidden mt-20">

            <div class="mb-8">

                <h2
                    class="text-3xl
                        font-bold
                        mb-2">

                    Related Products

                </h2>

                <p class="text-slate-400">

                    You may also like these products.

                </p>

            </div>


            <div
                id="relatedProductsContainer"
                class="grid grid-cols-1
                    sm:grid-cols-2
                    lg:grid-cols-3
                    gap-6">

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-800 mt-16">

        <div class="max-w-7xl mx-auto px-6 py-8">

            <p class="text-center text-slate-500">

                © 2026 PC HUB. All rights reserved.

            </p>

        </div>

    </footer>


    <script src="js/api.js"></script>
    <script src="js/singleProduct.js"></script>
    <script src="js/navbar.js"></script>

</body>

</html>
