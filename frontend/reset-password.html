<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | PC HUB</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body class="min-h-screen bg-slate-950 text-white">


    <!-- NAVBAR -->

    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-950 border-b border-slate-800">

        <nav class="max-w-7xl mx-auto px-4 sm:px-6 py-4">

            <div class="flex items-center justify-between">

                <a href="index.html">

                    <img
                        src="img/PC_HUB_logo.png"
                        alt="PC HUB logo"
                        class="w-28 sm:w-32 h-auto">

                </a>


                <a
                    href="login.html"
                    class="text-sm sm:text-base text-slate-300 hover:text-cyan-400 transition">

                    Back to Login

                </a>

            </div>

        </nav>

    </header>


    <!-- RESET PASSWORD -->

    <main
        class="min-h-[calc(100vh-73px)]
               flex items-center justify-center
               px-4 sm:px-6
               py-10 sm:py-12
               pt-28">

        <div class="w-full max-w-md">


            <!-- INTRO -->

            <div class="text-center mb-6 sm:mb-8">

                <h1 class="text-2xl sm:text-3xl font-bold mb-3">

                    Reset Password

                </h1>


                <p class="text-sm sm:text-base text-slate-400">

                    Enter your new password below.

                </p>

            </div>


            <!-- FORM -->

            <form
                id="resetPasswordForm"
                class="bg-slate-900 border border-slate-800
                       rounded-2xl
                       p-5 sm:p-8
                       space-y-5">


                <!-- NEW PASSWORD -->

                <div>

                    <label
                        for="password"
                        class="block text-sm font-medium
                               text-slate-300 mb-2">

                        New Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-lg
                               bg-slate-950 border border-slate-700
                               text-white outline-none
                               focus:border-cyan-400"
                        placeholder="Enter your new password">

                </div>


                <!-- CONFIRM PASSWORD -->

                <div>

                    <label
                        for="confirmPassword"
                        class="block text-sm font-medium
                               text-slate-300 mb-2">

                        Confirm Password

                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        minlength="6"
                        class="w-full px-4 py-3 rounded-lg
                               bg-slate-950 border border-slate-700
                               text-white outline-none
                               focus:border-cyan-400"
                        placeholder="Confirm your new password">

                </div>


                <!-- MESSAGE -->

                <p
                    id="resetPasswordMessage"
                    class="hidden text-sm">

                </p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="w-full py-3 rounded-lg
                           bg-cyan-500 text-slate-950
                           font-semibold
                           hover:bg-cyan-400 transition">

                    Reset Password

                </button>


                <!-- LOGIN LINK -->

                <p class="text-center text-sm text-slate-500">

                    Remember your password?

                    <a
                        href="login.html"
                        class="text-cyan-400 hover:underline">

                        Login

                    </a>

                </p>

            </form>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
